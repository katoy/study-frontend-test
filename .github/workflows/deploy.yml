name: CI/CD to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages へのデプロイに必要なアクセス権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # テストとビルドのジョブ
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-test-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter and formatter checks (Biome)
        run: npm run biome:check

      - name: Run stylelint
        run: npm run lint:style

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-test-app/dist

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
